<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">    
    <title>{{ page_title | default("Marble") }}</title>
    {% if require_login is defined %}
        <script>window.requireLogin = {{ "true" if require_login else "false" }}</script>
    {% else %}
        <script>window.requireLogin = true</script>
    {% endif %}
    <script src="js/{{ page_name }}.js"></script>
    <link rel="stylesheet" href="css/{{ page_name }}.css">

    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}
    {% endblock %}
</body>
</html>
